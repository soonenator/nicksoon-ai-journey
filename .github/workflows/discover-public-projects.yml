name: Discover public projects
on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: discover-public-projects
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'soonenator/nicksoon-ai-journey'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/check.cjs && node --test tests/discovery.cjs
      - id: discovery
        run: node scripts/discover-public-projects.cjs --write
      # Run here even if GitHub does not trigger CI for the bot's PR.
      - run: node tests/check.cjs && node --test tests/discovery.cjs
      - name: Propose a reviewable update
        if: steps.discovery.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.discovery.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not overwrite reviewer edits or recreate a rejected batch.
          existing=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state all --json number --jq 'length')
          if [ "$existing" != 0 ]; then
            echo 'This batch already has a PR; review it or ignore rejected repository IDs.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- data.js
          git commit -m 'Propose newly discovered public projects'
          # Credentials are used only for the push, never by discovery.
          gh auth setup-git
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          cat > /tmp/public-projects-pr.md <<'BODY'
          Adds source-link cards for public, owner-controlled repositories explicitly tagged ai-journey.

          Review titles, dates (discovery dates), duplicate projects, AI attribution, and public suitability before merging. No private data or remote source files were imported. Existing cards and artifacts are preserved.

          Validation ran before and after generation: node tests/check.cjs and node --test tests/discovery.cjs. No automatic merge or approval is configured. Rejected repositories should be added to ignoredRepositoryIds in scripts/discover-public-projects.cjs before closing.
          BODY
          gh pr create --repo "$REPOSITORY" --base "$BASE" --head "$BRANCH" --title 'Add newly discovered public projects' --body-file /tmp/public-projects-pr.md
